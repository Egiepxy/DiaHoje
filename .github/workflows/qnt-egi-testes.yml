name: QNT EGI — Testes Automáticos (simulação)

on:
  schedule:
    # 23 minutos após cada novo candle 4h fechado, em UTC (00/04/08/12/16/20).
    # BRT: 21:23, 01:23, 05:23, 09:23, 13:23, 17:23.
    # GitHub Actions pode atrasar/omitir execuções; o painel acusa dados desatualizados.
    - cron: "23 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      relatorio_completo:
        description: "Robustez 90d e custos? auto = segundas; true = agora"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: qnt-egi-testes-automaticos
  cancel-in-progress: false

jobs:
  testar-qnt:
    name: Testar QNTUSDT 3+2 vs V1.1 e HOLD — sem ordens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código do DiaHoje
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Executar simulações com candles fechados da Binance Spot
        env:
          QNT_FULL: ${{ inputs.relatorio_completo || 'auto' }}
        run: node scripts/qnt-egi-autoteste.mjs

      - name: Preservar último resultado válido para o painel público
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios/qnt-egi/ultimo.json relatorios/qnt-egi/RelGPT_QNT.txt
          if ! git diff --cached --quiet; then
            git commit -m "QNT EGI: registrar candle 4h e auditoria fictícia [skip ci]"
            git push
          fi

      - name: Publicar resumo legível na execução
        if: always()
        shell: bash
        run: |
          if test -f relatorios/qnt-egi/RelGPT_QNT.txt; then
            {
              echo '## QNT EGI — Relatório automático'
              echo ''
              echo 'Somente estudo; nenhuma ordem real.'
              echo ''
              echo '~~~text'
              sed -n '1,42p' relatorios/qnt-egi/RelGPT_QNT.txt
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar RelGPT TXT e JSON desta execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnt-egi-relatorio-${{ github.run_number }}
          path: relatorios/qnt-egi/
          retention-days: 90
          if-no-files-found: error
